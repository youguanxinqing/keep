[package]
name = "keep"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "A project-aware process supervisor for local development"
license = "MIT"

[dependencies]
clap = { version = "4.5.40", features = ["derive"] }
dotenvy = "0.15.7"
humantime = "2.2.0"
indexmap = { version = "2.9.0", features = ["serde"] }
nix = { version = "0.30.1", features = ["fs", "process", "resource", "signal", "term", "user"] }
rustls = { version = "=0.23.38", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
signal-hook = "0.3.18"
thiserror = "2.0.12"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }

[dev-dependencies]
tempfile = "3.20.0"

[profile.release]
lto = "thin"
strip = "symbols"
